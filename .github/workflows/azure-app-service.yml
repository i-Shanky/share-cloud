name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: sharecloud-app
  NODE_VERSION: '18.x'
  RESOURCE_GROUP: sharecloud-rg

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Next.js application
      run: npm run build
      env:
        # Only account name needed — key replaced by Managed Identity
        AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
        AZURE_STORAGE_CONTAINER_NAME: ${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}
        AZURE_STORAGE_TRASH_CONTAINER_NAME: ${{ secrets.AZURE_STORAGE_TRASH_CONTAINER_NAME }}
        AZURE_AD_CLIENT_ID: ${{ secrets.AZURE_AD_CLIENT_ID }}
        AZURE_AD_CLIENT_SECRET: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
        AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
        NEXTAUTH_URL_INTERNAL: ${{ secrets.NEXTAUTH_URL }}

    - name: Create deployment package
      run: |
        zip -r deployment.zip .next public pages lib styles package.json package-lock.json next.config.js

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-artifact
        path: deployment.zip
        retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Skip if secrets are not configured
    if: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}

    permissions:
      id-token: write   # Required for OIDC login
      contents: read

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: build-artifact

    - name: Login to Azure (OIDC — no long-lived secret)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Enable system-assigned Managed Identity on Web App
      run: |
        az webapp identity assign \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }}

    - name: Grant Managed Identity access to Storage (Storage Blob Data Contributor)
      run: |
        PRINCIPAL_ID=$(az webapp identity show \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --query principalId -o tsv)

        STORAGE_SCOPE=$(az storage account show \
          --name ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --query id -o tsv)

        az role assignment create \
          --assignee $PRINCIPAL_ID \
          --role "Storage Blob Data Contributor" \
          --scope $STORAGE_SCOPE

    - name: Set App Service environment variables
      uses: azure/appservice-settings@v1
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        app-settings-json: |
          [
            {
              "name": "AZURE_STORAGE_ACCOUNT_NAME",
              "value": "${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}",
              "slotSetting": false
            },
            {
              "name": "AZURE_STORAGE_CONTAINER_NAME",
              "value": "${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}",
              "slotSetting": false
            },
            {
              "name": "AZURE_STORAGE_TRASH_CONTAINER_NAME",
              "value": "${{ secrets.AZURE_STORAGE_TRASH_CONTAINER_NAME }}",
              "slotSetting": false
            },
            {
              "name": "AZURE_AD_CLIENT_ID",
              "value": "${{ secrets.AZURE_AD_CLIENT_ID }}",
              "slotSetting": false
            },
            {
              "name": "AZURE_AD_CLIENT_SECRET",
              "value": "${{ secrets.AZURE_AD_CLIENT_SECRET }}",
              "slotSetting": false
            },
            {
              "name": "AZURE_AD_TENANT_ID",
              "value": "${{ secrets.AZURE_AD_TENANT_ID }}",
              "slotSetting": false
            },
            {
              "name": "NEXTAUTH_SECRET",
              "value": "${{ secrets.NEXTAUTH_SECRET }}",
              "slotSetting": false
            },
            {
              "name": "NEXTAUTH_URL",
              "value": "${{ secrets.NEXTAUTH_URL }}",
              "slotSetting": false
            },
            {
              "name": "NEXTAUTH_URL_INTERNAL",
              "value": "${{ secrets.NEXTAUTH_URL }}",
              "slotSetting": false
            },
            {
              "name": "CLEANUP_API_KEY",
              "value": "${{ secrets.CLEANUP_API_KEY }}",
              "slotSetting": false
            },
            {
              "name": "SCM_DO_BUILD_DURING_DEPLOYMENT",
              "value": "true",
              "slotSetting": false
            },
            {
              "name": "WEBSITE_NODE_DEFAULT_VERSION",
              "value": "~18",
              "slotSetting": false
            }
          ]

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: deployment.zip

    - name: Logout from Azure
      run: az logout
