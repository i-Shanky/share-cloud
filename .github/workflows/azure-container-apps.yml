name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_CONTAINER_APP_NAME: sharecloud-container
  AZURE_CONTAINER_REGISTRY: sharecloud
  AZURE_RESOURCE_GROUP: sharecloud-rg
  IMAGE_NAME: sharecloud-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # Required for OIDC login
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Azure (OIDC — no long-lived secret)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Azure Container Registry
      run: az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Login to Azure (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Enable system-assigned Managed Identity on Container App
      run: |
        az containerapp identity assign \
          --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --system-assigned

    - name: Grant Managed Identity access to Storage
      run: |
        PRINCIPAL_ID=$(az containerapp identity show \
          --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query principalId -o tsv)

        STORAGE_SCOPE=$(az storage account show \
          --name ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query id -o tsv)

        az role assignment create \
          --assignee $PRINCIPAL_ID \
          --role "Storage Blob Data Contributor" \
          --scope $STORAGE_SCOPE

    - name: Update Container App secrets
      run: |
        az containerapp secret set \
          --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --secrets \
            azure-storage-account-name="${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}" \
            azure-storage-container-name="${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}" \
            azure-storage-trash-container-name="${{ secrets.AZURE_STORAGE_TRASH_CONTAINER_NAME }}" \
            azure-ad-client-id="${{ secrets.AZURE_AD_CLIENT_ID }}" \
            azure-ad-client-secret="${{ secrets.AZURE_AD_CLIENT_SECRET }}" \
            azure-ad-tenant-id="${{ secrets.AZURE_AD_TENANT_ID }}" \
            nextauth-secret="${{ secrets.NEXTAUTH_SECRET }}" \
            nextauth-url="${{ secrets.NEXTAUTH_URL }}" \
            cleanup-api-key="${{ secrets.CLEANUP_API_KEY }}"

    - name: Deploy new image to Container App
      uses: azure/container-apps-deploy-action@v1
      with:
        containerAppName: ${{ env.AZURE_CONTAINER_APP_NAME }}
        resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
        imageToDeploy: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
        environmentVariables: |
          AZURE_STORAGE_ACCOUNT_NAME=secretref:azure-storage-account-name
          AZURE_STORAGE_CONTAINER_NAME=secretref:azure-storage-container-name
          AZURE_STORAGE_TRASH_CONTAINER_NAME=secretref:azure-storage-trash-container-name
          AZURE_AD_CLIENT_ID=secretref:azure-ad-client-id
          AZURE_AD_CLIENT_SECRET=secretref:azure-ad-client-secret
          AZURE_AD_TENANT_ID=secretref:azure-ad-tenant-id
          NEXTAUTH_SECRET=secretref:nextauth-secret
          NEXTAUTH_URL=secretref:nextauth-url
          CLEANUP_API_KEY=secretref:cleanup-api-key

    - name: Logout from Azure
      run: az logout
